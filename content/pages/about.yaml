intro: "Book in Cambodia helps readers find books in Cambodia. Search for a book, see which bookstores, libraries and sellers have it, and contact them directly. If no one has it yet, request it so stores and volunteers know people are looking for it."
introKm: "សៀវភៅនៅកម្ពុជា ជួយអ្នកអានស្វែងរកសៀវភៅនៅកម្ពុជា។ ស្វែងរកសៀវភៅ មើលថាបណ្ណាគារ បណ្ណាល័យ និងអ្នកលក់ណាខ្លះមានវា ហើយទាក់ទងពួកគេដោយផ្ទាល់។ ប្រសិនបើមិនទាន់មាននរណាមានទេ សូមស្នើសុំវា ដើម្បីឱ្យហាង និងអ្នកស្ម័គ្រចិត្តដឹងថាមានអ្នកកំពុងរក។"
sections:
  - heading: "Non-profit, by design"
    headingKm: "មិនរកប្រាក់ចំណេញ"
    body: "We don't sell books, show ads or take commissions. Every store and library is listed free and treated equally; no one can pay to be shown first. Our code is open source and our catalog is open data."
    bodyKm: "យើងមិនលក់សៀវភៅ មិនបង្ហាញការផ្សាយពាណិជ្ជកម្ម និងមិនយកកម្រៃជើងសារទេ។ ហាង និងបណ្ណាល័យនីមួយៗ ត្រូវបានចុះបញ្ជីដោយឥតគិតថ្លៃ និងស្មើភាពគ្នា។ កូដរបស់យើងជាកូដចំហ ហើយទិន្នន័យសៀវភៅរបស់យើងជាទិន្នន័យចំហ។"
  - heading: "Where the information comes from"
    headingKm: "ព័ត៌មានមកពីណា"
    body: "Volunteers, readers and stores add and update listings. Each listing shows the date it was last checked. If something is wrong or out of date, please report it."
    bodyKm: "អ្នកស្ម័គ្រចិត្ត អ្នកអាន និងហាងនានា បន្ថែម និងធ្វើបច្ចុប្បន្នភាពព័ត៌មាន។ ព័ត៌មាននីមួយៗបង្ហាញកាលបរិច្ឆេទដែលបានពិនិត្យចុងក្រោយ។ ប្រសិនបើមានអ្វីខុស ឬហួសសម័យ សូមរាយការណ៍មកយើង។"
  - heading: "How to help"
    headingKm: "របៀបជួយ"
    body: "Add books you see in stores, check store details, translate pages into Khmer, or help build the website on GitHub. Every contribution helps the next reader."
    bodyKm: "បន្ថែមសៀវភៅដែលអ្នកឃើញនៅក្នុងហាង ពិនិត្យព័ត៌មានហាង បកប្រែទំព័រជាភាសាខ្មែរ ឬជួយបង្កើតគេហទំព័រនៅលើ GitHub។ ការចូលរួមនីមួយៗជួយអ្នកអានបន្ទាប់។"

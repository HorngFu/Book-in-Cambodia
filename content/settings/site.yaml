tagline: "Find any book in Cambodia"
taglineKm: "ស្វែងរកសៀវភៅណាមួយនៅកម្ពុជា"
disclaimer: "Book in Cambodia is a community directory. We don't sell books, handle payments or take commissions. Prices and stock are reported by volunteers and can change, so please contact the store to confirm before you travel or pay."
disclaimerKm: "សៀវភៅនៅកម្ពុជា ជាបញ្ជីរបស់សហគមន៍។ យើងមិនលក់សៀវភៅ មិនទទួលការទូទាត់ និងមិនយកកម្រៃជើងសារទេ។ តម្លៃ និងស្តុកត្រូវបានរាយការណ៍ដោយអ្នកស្ម័គ្រចិត្ត ហើយអាចប្រែប្រួល ដូច្នេះសូមទាក់ទងហាងដើម្បីបញ្ជាក់ មុនពេលធ្វើដំណើរ ឬបង់ប្រាក់។"

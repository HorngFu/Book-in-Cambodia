name: 🐞 Website bug
description: Something on the website doesn't work.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: page_url
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android phone, Chrome

name: Preview

# Uploads each pull request as a preview version of the Worker (not deployed to
# production) and comments the preview link, so reviewers can check content and
# code changes before merging. Only runs for branches in this repository, since
# pull requests from forks can't read the Cloudflare secrets.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALIAS: pr-${{ github.event.number }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set; skipping preview."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        name: Build and upload preview
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare upload --preview-alias "$ALIAS" | tee upload.log
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
      - if: steps.secrets.outputs.ready == 'true' && env.PREVIEW_URL != ''
        name: Comment preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --repo "${{ github.repository }}" --edit-last --create-if-none \
            --body "Preview of this pull request: $PREVIEW_URL (updated for ${GITHUB_SHA::7})"
